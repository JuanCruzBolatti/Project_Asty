[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asty_pipeline"
version = "0.1.0"
description = "Data pipeline for Asty (municipal budget visualization)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "pdfplumber>=0.10.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas-stubs~=3.0.3",
    "pyarrow",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["asty_pipeline"]
